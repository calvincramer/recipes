<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" %}{{ page.name | remove: ".md" | remove: ".html" }} · {% endif %}{{ site.title }}</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1rem 16px 3rem;line-height:1.55}
    nav{padding-bottom:.5rem;border-bottom:1px solid #8884;margin-bottom:1rem}
    img{max-width:100%}
  </style>
</head>
<body>
  <nav><a href="{{ '/' | relative_url }}">🍳 All recipes</a></nav>
  <main>{{ content }}</main>
  <script>
    // Source links point at .md files (so they work in Obsidian/GitHub); serve them as .html here.
    document.querySelectorAll('main a[href]').forEach(function (a) {
      var h = a.getAttribute('href');
      if (/^[a-z][a-z0-9+.-]*:/i.test(h)) return;
      a.setAttribute('href', h.replace(/\.md(?=$|#|\?)/, '.html'));
    });
  </script>
</body>
</html>
